<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111412"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Haul Desk"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Haul Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F2EE; --panel:#FFFFFF; --panel2:#E8EAE4; --ink:#1A1F1B; --ink2:#48504B; --muted:#737B75; --line:#D6D9D1;
  --accent:#D24E0C; --accent-ink:#FFFFFF; --accent-soft:#FBE4D6;
  --green:#2C6650; --green-soft:#DAEAE1;
  --good:#2B7A4C; --good-soft:#DDF0E4; --warn:#9A6212; --warn-soft:#F7EACF; --bad:#B8362A; --bad-soft:#F8DEDA;
  --c-don:#2F7D5B; --c-rec:#3B6FB6; --c-land:#8C918E;
  --shadow:0 1px 2px rgba(20,32,26,.06),0 8px 24px rgba(20,32,26,.08);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111412; --panel:#1A1E1B; --panel2:#242925; --ink:#E6EAE7; --ink2:#B4BCB7; --muted:#8A938D; --line:#2E3430;
  --accent:#FF7B3D; --accent-ink:#1C0D05; --accent-soft:#3A2418;
  --green:#7CC3A3; --green-soft:#1D2F27;
  --good:#5DC48C; --good-soft:#18301F; --warn:#E3AA4E; --warn-soft:#342812; --bad:#F06C5C; --bad-soft:#3A1B17;
  --c-don:#5DB38C; --c-rec:#6F9BE0; --c-land:#7E8581;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111412; --panel:#1A1E1B; --panel2:#242925; --ink:#E6EAE7; --ink2:#B4BCB7; --muted:#8A938D; --line:#2E3430;
  --accent:#FF7B3D; --accent-ink:#1C0D05; --accent-soft:#3A2418;
  --green:#7CC3A3; --green-soft:#1D2F27;
  --good:#5DC48C; --good-soft:#18301F; --warn:#E3AA4E; --warn-soft:#342812; --bad:#F06C5C; --bad-soft:#3A1B17;
  --c-don:#5DB38C; --c-rec:#6F9BE0; --c-land:#7E8581;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--body);padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-block:0 96px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;max-width:1080px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.brand h1{font:700 26px/1 var(--display);letter-spacing:.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.brand .blogo{height:40px;width:auto;border-radius:6px;flex:none;align-self:center}
.brand:has(.blogo){align-items:center}
.brand .dot{width:10px;height:10px;border-radius:2px;background:var(--accent);flex:none;transform:translateY(-2px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.iconbtn{width:38px;height:38px;padding:0;border-radius:8px}
nav.tabs{display:flex;gap:4px;max-width:1080px;margin:10px auto 0;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 12px 11px;font:600 17px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.bottom{display:none}
@media (max-width:720px){
  nav.tabs{display:none}
  header.top{padding-bottom:12px}
  nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font:600 13px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  nav.bottom button svg{width:22px;height:22px}
  nav.bottom button[aria-current="true"]{color:var(--accent)}
  .hide-sm{display:none}
}

/* layout */
main{display:grid;gap:22px;padding-top:18px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px;font-weight:500}
.sec{display:grid;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h2{font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}
h3{font:600 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0;color:var(--ink2)}
.sub{color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.tile .k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile .v{font:700 32px/1.05 var(--display);font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--ink2)}
.tile.hi .v{color:var(--accent)}

/* cards & lists */
.list{display:grid;gap:8px}
.card{display:grid;gap:4px;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink)}
button.card:hover,.card .open:hover{border-color:var(--muted)}
.card .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .name{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .what{color:var(--ink2);font-size:14px}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.card .meta .num{color:var(--ink);font-weight:600}
.card.sched{grid-template-columns:auto 1fr;gap:4px 14px;padding:0;overflow:hidden}
.card.sched .when{grid-row:span 2;background:var(--panel2);padding:12px;display:grid;align-content:center;justify-items:center;min-width:74px}
.card.sched .when b{font:700 24px/1 var(--display)}
.card.sched .when span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.card.sched .open{border:0;background:none;text-align:left;padding:12px 14px 0 0;display:grid;gap:4px;color:var(--ink)}
.card.sched .acts{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px 0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--panel2);color:var(--ink2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-lead{background:var(--accent-soft);color:var(--accent)}
.st-quoted{background:var(--warn-soft);color:var(--warn)}
.st-booked{background:var(--green-soft);color:var(--green)}
.st-done{background:var(--good-soft);color:var(--good)}
.st-lost{background:var(--panel2);color:var(--muted)}
.ex{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 5px}
.todo{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 0;overflow:hidden;text-align:left;width:100%;color:var(--ink)}
.todo:hover{border-color:var(--muted)}
.todo .stripe{align-self:stretch;margin:-10px 0}
.todo .t1{font-weight:600;font-size:14px}
.todo .t2{font-size:13px;color:var(--muted)}
.todo .why{font-size:12px;font-weight:600;white-space:nowrap}
.pr-urgent .stripe{background:var(--bad)} .pr-urgent .why{color:var(--bad)}
.pr-warn .stripe{background:var(--warn)} .pr-warn .why{color:var(--warn)}
.pr-info .stripe{background:var(--green)} .pr-info .why{color:var(--green)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);text-align:center;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button .n{opacity:.65;margin-left:4px}
.search{width:100%;max-width:360px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* reports */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav b{font:700 20px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;min-width:150px;text-align:center}
.trend{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:180px;padding-top:22px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 44px,var(--line) 44px 45px)}
.trend .col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;outline-offset:3px}
.trend .b{background:var(--green);opacity:.45;border-radius:4px 4px 0 0;min-height:2px}
.trend .col.sel .b{opacity:1;background:var(--accent)}
.trend .col .lab{position:absolute;bottom:calc(var(--h) + 4px);left:0;right:0;text-align:center;font:600 14px/1 var(--display);color:var(--ink)}
.trend-x{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;text-align:center;font-size:12px;color:var(--muted);padding-top:6px}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;z-index:5;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:500 12px/1.3 var(--body);padding:6px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}
.trend .col[data-tip]:hover::after,.trend .col[data-tip]:focus-visible::after{bottom:auto;top:-4px;transform:translate(-50%,-100%)}
.srcs{overflow-x:auto}
.srcs table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
.srcs th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:0 8px 8px}
.srcs td{padding:7px 8px;border-top:1px solid var(--line)}
.srcs td.r,.srcs th.r{text-align:right}
.meter{height:12px;background:var(--panel2);border-radius:0 4px 4px 0;min-width:80px}
.meter i{display:block;height:100%;background:var(--green);border-radius:0 4px 4px 0}
.stack{display:flex;gap:2px;height:22px;border-radius:0 4px 4px 0;overflow:hidden;background:var(--panel)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* sheet (editor) */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.sheet{background:var(--bg);width:100%;max-width:760px;border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
@media (max-width:720px){.scrim{padding:0}.sheet{border-radius:0;min-height:100%}}
.sheet-h{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.sheet-h h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b{padding:16px;display:grid;gap:18px}
.sheet-f{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;border-radius:0 0 14px 14px}
.sheet-f .sp{flex:1}
fieldset{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px;margin:0;display:grid;gap:12px;min-width:0}
legend{font:700 16px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;padding:0 6px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;min-width:0}
label.f input,label.f select,label.f textarea{font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;min-width:0}
label.f textarea{min-height:70px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:560px){.segs{grid-template-columns:repeat(3,1fr)}}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:grid;gap:1px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:7px 4px;background:var(--bg);cursor:pointer}
.seg b{font:700 18px/1 var(--display)}
.seg small{font-size:12px;color:var(--muted)}
.seg input:checked+span{border-color:var(--accent);background:var(--accent-soft)}
.seg input:checked+span small{color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.qty{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;font-size:14px}
.qty input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%}
.items{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
@media (max-width:560px){.items{grid-template-columns:1fr}}
.total{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 14px}
.total .v{font:700 36px/1 var(--display);font-variant-numeric:tabular-nums}
.total .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.7;font-weight:600}
.total .btn{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.3)}
.profitline{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink2)}
.profitline b{font-variant-numeric:tabular-nums;color:var(--ink)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;background:var(--panel2);border:0;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px}
.ph .x{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:1}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.contact{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.contact .val{font-weight:600;user-select:all}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:24px}
.lightbox img{max-height:100%;border-radius:6px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast input{margin-top:6px;width:100%;padding:6px;border-radius:4px;border:0;color:#111}
.set-table{width:100%;border-collapse:collapse;font-size:14px}
.set-table td{padding:5px 0;border-top:1px solid var(--line);vertical-align:middle}
.set-table td:last-child{width:120px;text-align:right}
.set-table input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right}
.set-table input.l{text-align:left}
.cust-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.importbox{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:4px 14px}
.importtoggle{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 0;font:700 17px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.importbody{display:grid;gap:10px;padding-bottom:12px}
.importbody[hidden]{display:none}
.importbody textarea{font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;min-height:120px;resize:vertical}
.rcpt{z-index:75;align-items:flex-start;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px}
.rcpt-panel{background:var(--bg);border-radius:12px;padding:14px;width:100%;max-width:600px;display:grid;gap:12px;box-shadow:var(--shadow)}
.rcpt-h{display:flex;align-items:center;justify-content:space-between}
.rcpt-canvas{width:100%;height:auto;display:block;border-radius:6px;border:1px solid var(--line)}
.rcpt-acts{display:flex;gap:8px;flex-wrap:wrap}
.logo-prev{width:120px;height:64px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
.pl{width:100%;border-collapse:collapse;font-size:15px}
.pl td{padding:8px 0;border-top:1px solid var(--line)}
.pl td.num{text-align:right;font-weight:600;white-space:nowrap}
.pl tr.tot td{border-top:2px solid var(--ink);font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.neg{color:var(--ink2)} .pos{color:var(--good)}
.pl tr.grp td{border-top:1px solid var(--line);padding:12px 0 2px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.pl tr.grp + tr td{border-top:0}

<script>
/* ---------- config ---------- */
const DEFAULT_SETTINGS = {
  businessName: "",
  reviewLink: "",
  volumes: [
    {key:"min", label:"Min", note:"Single item", price:95},
    {key:"1/8", label:"1/8", price:149},
    {key:"1/4", label:"1/4", price:229},
    {key:"3/8", label:"3/8", price:299},
    {key:"1/2", label:"1/2", price:379},
    {key:"5/8", label:"5/8", price:439},
    {key:"3/4", label:"3/4", price:499},
    {key:"7/8", label:"7/8", price:549},
    {key:"full", label:"Full", price:599}
  ],
  materials: [
    {key:"household", label:"Household / furniture", mult:1},
    {key:"yard", label:"Yard waste / brush", mult:0.9},
    {key:"construction", label:"Construction / reno debris", mult:1.15},
    {key:"heavy", label:"Heavy: concrete, dirt, shingles", mult:1.35}
  ],
  weights: [
    {key:"light", label:"Light (boxes, bags)", add:0},
    {key:"normal", label:"Normal", add:0},
    {key:"heavy", label:"Heavy", add:60},
    {key:"xheavy", label:"Very heavy (1+ ton)", add:150}
  ],
  access: [
    {key:"curb", label:"Curbside / driveway", add:-20},
    {key:"stairs", label:"Stairs (per flight)", add:35, perUnit:true},
    {key:"carry", label:"Long carry (50+ ft)", add:40},
    {key:"tight", label:"Attic / crawlspace / tight", add:75},
    {key:"demo", label:"Disassembly / light demo", add:100}
  ],
  items: [
    {key:"mattress", label:"Mattress / box spring", price:25},
    {key:"tv", label:"TV / monitor", price:25},
    {key:"freon", label:"Fridge / freezer / AC", price:50},
    {key:"tire", label:"Tire", price:15},
    {key:"paint", label:"Paint can", price:10},
    {key:"piano", label:"Piano / safe / hot tub", price:150}
  ],
  dumpFullLoad: 110,
  dumpSite: "Rutherford County Landfill",
  dumpMin: 51.55, dumpMinLbs: 1000, dumpPerTon: 104.95, mattressDumpFee: 25, fullLoadLbs: 2000,
  helpers: [],
  fuelPerJob: 15,
  costPerMile: 0.30,
  ownerHourly: 25,
  phone: "", email: "", city: "", logo: "",
  taxRate: 0,
  receiptNote: "Thank you for your business!"
};
const STATUSES = [
  {key:"lead", label:"New lead"},
  {key:"quoted", label:"Quoted"},
  {key:"booked", label:"Booked"},
  {key:"done", label:"Completed"},
  {key:"lost", label:"Lost"}
];
const SOURCES = ["Friends & family","Referral","Yard sign","Facebook","Facebook Marketplace","Website form","Google","Phone call","Text","Repeat customer","Nextdoor","Organic","Other","Unknown"];
const EXP_CATS = ["Vehicle & trailer","Tools & equipment","Supplies","Marketing","Phone & software","Insurance","Storage","Business setup","Dump fees","Fuel","Food","Uniforms","Other"];
const INC_CATS = ["Resale","Scrap","Other income"];
const COST_TYPES = [["variable","Variable — goes up with each job"],["monthly","Fixed — monthly bill"],["onetime","Fixed — equipment / one-time"]];
const CAT_TYPE = {"Phone & software":"monthly","Insurance":"monthly","Storage":"monthly","Vehicle & trailer":"onetime","Tools & equipment":"onetime","Business setup":"onetime","Marketing":"onetime","Uniforms":"onetime","Supplies":"variable","Dump fees":"variable","Fuel":"variable","Food":"variable","Other":"variable"};
const costTypeOf = l => l.costType || CAT_TYPE[l.category] || "variable";
const TYPE_SHORT = {variable:"Variable", monthly:"Monthly bill", onetime:"Equipment / one-time", buyout:"Buyout"};
EXP_CATS.push("Partner buyout"); CAT_TYPE["Partner buyout"]="buyout";
COST_TYPES.push(["buyout","Partner buyout — not a business expense"]);
/* planned = a scheduled payment not made yet; it doesn't count until marked paid */
const ledgerIn = pre => state.ledger.filter(l=>!l.planned && (l.date||"").startsWith(pre));
const isOpExp = l => l.kind!=="income" && costTypeOf(l)!=="buyout";
const CUST_TYPES = ["Residential","Property manager","Realtor","Contractor","Commercial"];
const PAY = ["Cash","Venmo","PayPal","Cash App","Check"];
const dumpFee = (lbs, mattresses=0, s=state.settings) => {
  lbs = Number(lbs)||0; if(!lbs && !mattresses) return 0;
  const base = !lbs ? 0 : lbs <= (s.dumpMinLbs||1000) ? (s.dumpMin||0) : lbs/2000*(s.dumpPerTon||0);
  return Math.round((base + mattresses*(s.mattressDumpFee||0))*100)/100;
};
const WINDOWS = ["8–10 AM","10 AM–12 PM","12–2 PM","2–4 PM","4–6 PM","Flexible"];
const VOL_FRACTION = {min:.06,"1/8":.125,"1/4":.25,"3/8":.375,"1/2":.5,"5/8":.625,"3/4":.75,"7/8":.875,full:1};

/* ---------- state ---------- */
const state = { jobs:[], customers:[], ledger:[], settings:structuredClone(DEFAULT_SETTINGS), view:"today", pipe:"open", pipeQ:"", custQ:"", month:"", loaded:{jobs:false,customers:false,settings:false,ledger:false}, live:false };
let DB = null, ASSETS = null, DOWNLOADS = null, SAMPLE = null;
const FINE_POINTER = (()=>{ try{ return matchMedia("(hover:hover) and (pointer:fine)").matches; }catch{ return false; } })();

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (n<0?"−$":"$") + Math.abs(Math.round(n||0)).toLocaleString();
const pad = n => String(n).padStart(2,"0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const addDays = (s,n) => { const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return dstr(d); };
const daysBetween = (a,b) => Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const fmtDate = s => s ? new Date(s+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}) : "";
const monthLabel = (m,opt={month:"long",year:"numeric"}) => { const [y,mo]=m.split("-").map(Number); return new Date(y,mo-1,1).toLocaleDateString(undefined,opt); };
const shiftMonth = (m,n) => { const [y,mo]=m.split("-").map(Number); const d=new Date(y,mo-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum = (arr,f) => arr.reduce((a,x)=>a+(Number(f(x))||0),0);
const cust = id => state.customers.find(c=>c.id===id);
const first = name => (name||"").trim().split(/\s+/)[0] || "there";
const biz = () => state.settings.businessName || "us";
const jobDate = j => j.date || (j.createdAt||"").slice(0,10);
const priceOf = j => Number(j.finalPrice) || Number(j.quoteTotal) || 0;
const costOf = j => sum(Object.values(j.costs||{}), x=>x);
const scrapOf = j => Number(j.scrap)||0;
/* Dump fees are paid per trip, not per job. Each dump run (a dump fee on a job, or a "Dump fees" expense)
   is split across the completed jobs since the previous run, weighted by job price. */
let _dumpKey=null, _dumpAlloc=null;
function dumpAllocation(){
  const key = state.jobs.length+":"+state.ledger.length+":"+(state._rev||0);
  if(_dumpKey===key && _dumpAlloc) return _dumpAlloc;
  const done = state.jobs.filter(j=>j.status==="done").sort((a,b)=>jobDate(a)<jobDate(b)?-1:jobDate(a)>jobDate(b)?1:0);
  const byDate = {};
  state.jobs.forEach(j=>{ const d=Number(j.costs?.dump)||0; if(d){ const k=jobDate(j); byDate[k]=(byDate[k]||0)+d; } });
  state.ledger.forEach(l=>{ if(l.kind!=="income" && l.category==="Dump fees" && l.date){ byDate[l.date]=(byDate[l.date]||0)+(Number(l.amount)||0); } });
  const est={}; let i=0, carry=0, allocRev=0, allocAmt=0;
  for(const d of Object.keys(byDate).sort()){
    const win=[]; while(i<done.length && jobDate(done[i])<=d){ win.push(done[i]); i++; }
    const amt = byDate[d]+carry, w = sum(win,priceOf);
    if(!win.length || !w){ carry = amt; continue; }
    carry = 0;
    win.forEach(j=>{ est[j.id]={amt: amt*priceOf(j)/w, run:d, n:win.length, runAmt:amt}; });
    allocRev += w; allocAmt += amt;
  }
  const ratio = allocRev ? allocAmt/allocRev : 0;
  for(; i<done.length; i++){ const j=done[i]; est[j.id]={amt: priceOf(j)*ratio, pending:true}; }
  _dumpKey=key; _dumpAlloc={est, ratio};
  return _dumpAlloc;
}
function volumeDumpEst(q, s=state.settings){
  const f=VOL_FRACTION[q?.volume]; if(!f) return null;
  const mf={household:1,yard:.8,construction:1.5,heavy:3}[q.material]||1, wf={light:.6,normal:1,heavy:1.4,xheavy:2}[q.weight]||1;
  return dumpFee(Math.round(f*(s.fullLoadLbs||2000)*mf*wf), Number(q.items?.mattress)||0);
}
function dumpEstOf(j){
  const a = dumpAllocation(), e = a.est[j.id];
  if(e) return e;
  const v = volumeDumpEst(j.quote);
  if(v!=null) return {amt:v, fromVolume:true};
  return {amt: priceOf(j)*a.ratio, pending:true};
}
const nonDumpCostOf = j => costOf(j) - (Number(j.costs?.dump)||0);
const jobProfitEstOf = j => priceOf(j) + scrapOf(j) - nonDumpCostOf(j) - dumpEstOf(j).amt;
const jobProfitOf = j => priceOf(j) + scrapOf(j) - costOf(j);
const wearOf = j => (Number(j.miles)||0) * (Number(state.settings.costPerMile)||0);
const trueProfitOf = j => jobProfitOf(j) - wearOf(j) - (Number(j.hours)||0)*(Number(state.settings.ownerHourly)||0);
const quoteLines = (q, s=state.settings) => {
  const out = []; if(!q || !q.volume) return out;
  const v = s.volumes.find(x=>x.key===q.volume); if(!v) return out;
  const adj = useAdj(s), one = singleItem(q, s);
  if(one){ out.push({label:`Single-item pickup — ${one.label.toLowerCase()}`, amount:Math.max(v.price, one.price)}); }
  else {
    const m = adj ? (s.materials.find(x=>x.key===q.material) || {mult:1,label:""}) : {mult:1,label:""};
    out.push({label:`Junk removal — ${v.key==="min"?"minimum load":v.label+" trailer load"}${m.label?` (${m.label.split(":")[0].toLowerCase()})`:""}`, amount:v.price*m.mult});
    const w = adj && s.weights.find(x=>x.key===q.weight); if(w && w.add) out.push({label:`Weight: ${w.label.toLowerCase()}`, amount:w.add});
    s.items.forEach(it=>{ const n=Number(q.items?.[it.key])||0; if(n) out.push({label:`${it.label} × ${n}`, amount:n*it.price}); });
  }
  if(adj) (q.access||[]).forEach(k=>{ const a=s.access.find(x=>x.key===k); if(!a||!a.add) return; const n=a.perUnit?Math.max(1,Number(q.flights)||1):1; out.push({label: a.perUnit?`${a.label.replace(/\s*\(.*\)/,"")} × ${n}`:a.label, amount:a.add*n}); });
  if(Number(q.adjust)) out.push({label:"Adjustment", amount:Number(q.adjust)});
  return out;
};
const statusLabel = k => (STATUSES.find(s=>s.key===k)||{}).label || k;
const chip = k => `<span class="chip st-${esc(k)}">${esc(statusLabel(k))}</span>`;
const mapUrl = a => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a);
const shortAddr = a => (a||"").split(",")[0];

const useAdj = (s=state.settings) => s.useAdjustments !== false;
const singleItemNote = () => { const mn = state.settings.volumes.find(v=>v.key==="min"); return `<p class="sub" style="margin:0">Single-item pickup: pick “Min” and enter 1 item. It's charged the higher of the ${money(mn?.price||0)} minimum or that item's fee.</p>`; };
const singleItem = (q, s=state.settings) => {
  if(q.volume!=="min") return null;
  const picked = s.items.filter(it=>Number(q.items?.[it.key])>0);
  return picked.length===1 && Number(q.items[picked[0].key])===1 ? picked[0] : null;
};
function calcQuote(q, s=state.settings){
  if(!q || !q.volume) return 0;
  const v = s.volumes.find(x=>x.key===q.volume); if(!v) return 0;
  const adj = useAdj(s), one = singleItem(q, s);
  let t;
  if(one) t = Math.max(v.price, one.price);
  else {
    const m = adj ? (s.materials.find(x=>x.key===q.material) || {mult:1}) : {mult:1};
    const w = adj ? (s.weights.find(x=>x.key===q.weight) || {add:0}) : {add:0};
    t = v.price*m.mult + w.add;
    s.items.forEach(it=>{ t += (Number(q.items?.[it.key])||0)*it.price; });
  }
  if(adj) (q.access||[]).forEach(k=>{ const a=s.access.find(x=>x.key===k); if(a) t += a.perUnit ? a.add*Math.max(1,Number(q.flights)||1) : a.add; });
  t += Number(q.adjust)||0;
  return Math.max(0, Math.round(t/5)*5);
}

/* ---------- persistence ---------- */
async function put(col, obj){
  const {id, ...body} = JSON.parse(JSON.stringify(obj));
  if(DB){
    try{ await DB.collection(col).doc(id).set(body); }
    catch(e){ toast(e?.code==="quota_exceeded" ? "Storage is full — remove old example data or lost leads in Settings." : "Couldn't save. Check your connection and try again."); throw e; }
  } else {
    _dumpKey=null; const arr = state[col]; const i = arr.findIndex(x=>x.id===id);
    if(i>=0) arr[i]={id,...body}; else arr.push({id,...body});
    render();
  }
}
async function remove(col, id){
  if(DB){ await DB.collection(col).doc(id).delete(); }
  else { _dumpKey=null; state[col] = state[col].filter(x=>x.id!==id); render(); }
}
async function saveSettingsDoc(s){
  if(DB) await DB.doc("settings/main").set(JSON.parse(JSON.stringify(s)));
  else { state.settings = s; render(); }
}

/* ---------- toast & copy ---------- */
let toastT;
function toast(msg, copyText){
  const t=$("#toast"); t.innerHTML = esc(msg) + (copyText!=null ? `<input id="toast-copy" readonly value="${esc(copyText)}">` : "");
  t.hidden=false; clearTimeout(toastT);
  if(copyText!=null){ const i=$("#toast-copy"); i.focus(); i.select(); }
  toastT=setTimeout(()=>t.hidden=true, copyText!=null?9000:2400);
}
function copyText(txt, label="Copied"){
  try{
    navigator.clipboard.writeText(txt).then(()=>toast(label), ()=>toast("Copy blocked — select the text below:", txt));
  }catch{ toast("Copy blocked — select the text below:", txt); }
}
const quoteMsg = (j,total) => { const c=cust(j.customerId), tx=Number(state.settings.taxRate)||0; return `Hi ${first(c?.name)}, thanks for reaching out to ${biz()}! Your quote for ${j.title||"junk removal"} is ${money(total)}${tx?` plus ${tx}% sales tax`:""} — that covers loading, hauling and disposal. Want me to lock in a time?`; };
const reviewMsg = j => { const c=cust(j.customerId); return `Thanks again for choosing ${biz()}, ${first(c?.name)}! If you have a minute, a quick review would really help our small business${state.settings.reviewLink?": "+state.settings.reviewLink:"."}`; };

/* ---------- nav ---------- */
const ICONS = {
  today:'<path d="M3 10h18M8 3v4M16 3v4"/><rect x="3" y="5" width="18" height="16" rx="2"/>',
  pipeline:'<path d="M4 5h16M6 12h12M9 19h6"/>',
  schedule:'<path d="M3 16V7h11v9"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
  customers:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/>',
  reports:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'
};
const VIEWS = [["today","Today"],["pipeline","Pipeline"],["schedule","Schedule"],["customers","Customers"],["reports","Reports"]];
function renderNav(){
  $("#tabs").innerHTML = VIEWS.map(([k,l])=>`<button data-act="nav" data-view="${k}" aria-current="${state.view===k}">${l}</button>`).join("") + `<button data-act="nav" data-view="settings" aria-current="${state.view==="settings"}">Settings</button>`;
  $("#bottomnav").innerHTML = VIEWS.map(([k,l])=>`<button data-act="nav" data-view="${k}" aria-current="${state.view===k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>${l}</button>`).join("");
  $("#bizname").textContent = state.settings.businessName || "Haul Desk";
  const dot = $(".brand .dot, .brand .blogo"), lg = state.settings.logo;
  if(lg && !(dot.tagName==="IMG" && dot.dataset.id===lg)){ const im=document.createElement("img"); im.className="blogo"; im.alt=""; im.dataset.id=lg; im.src=blobUrl(lg); dot.replaceWith(im); }
  else if(!lg && dot.tagName==="IMG"){ const sp=document.createElement("span"); sp.className="dot"; dot.replaceWith(sp); }
}

/* ---------- components ---------- */
function jobCard(j){
  const c = cust(j.customerId), p = priceOf(j);
  return `<button class="card" data-act="openJob" data-id="${esc(j.id)}">
    <span class="r1"><span class="name">${esc(c?.name||"No customer")}</span>${chip(j.status)}</span>
    <span class="what">${esc(j.title||"Junk removal")}</span>
    <span class="meta">${j.date?`<span>${fmtDate(j.date)}${j.window?" · "+esc(j.window):""}</span>`:""}${j.address?`<span>${esc(shortAddr(j.address))}</span>`:""}${p?`<span class="num">${money(p)}${j.status==="done"&&!j.paid?" unpaid":""}</span>`:""}<span>${esc(j.source||"")}</span>${j.example?'<span class="ex">Example</span>':""}</span>
  </button>`;
}
function tile(k,v,d,hi){ return `<div class="tile${hi?" hi":""}"><span class="k">${k}</span><span class="v">${v}</span>${d?`<span class="d">${d}</span>`:""}</div>`; }

function followUps(){
  const t = today(), out=[];
  for(const j of state.jobs){
    const c = cust(j.customerId), who = c?.name || "No customer", age = daysBetween((j.createdAt||t).slice(0,10), t);
    if((j.status==="lead"||j.status==="quoted") && j.followUp && j.followUp<=t)

      const last = jobs.map(jobDate).sort().pop();
      if(last && daysBetween(last,t)>=45 && !state.jobs.some(j=>j.customerId===c.id && ["lead","quoted","booked"].includes(j.status)))
        out.push({c, pr:"info", why:`${daysBetween(last,t)}d since last job`, t1:c.name, t2:`${c.type} — check in for new work`});
    }
  }

    const dd = daysBetween(t, l.date);

/* ---------- render ---------- */
function render(){
  renderNav();
  const ready = !DB || (state.loaded.jobs && state.loaded.customers);
  if(!ready){ $("#main").innerHTML = `<div class="loading">Loading your jobs…</div>`; return; }
  const banner = !state.live ? `<div class="banner">Preview mode with example data. This browser can't save data here. Open the app in Safari or Chrome (not a private window).</div>` : "";
  const v = {today:viewToday, pipeline:viewPipeline, schedule:viewSchedule, customers:viewCustomers, reports:viewReports, settings:viewSettings}[state.view];
  const focusId = document.activeElement?.id, pos = document.activeElement?.selectionStart;
  if(state.view==="settings" && $("#s-name") ) return; // don't clobber an open settings form
  $("#main").innerHTML = banner + v();
  if(focusId && (focusId==="pipe-q"||focusId==="cust-q")){ const el=$("#"+focusId); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch{} } }
}
function go(view){ state.view=view; $("#main").innerHTML=""; render(); window.scrollTo(0,0); }

function openJob(id, preset){
  const j = id && state.jobs.find(x=>x.id===id);

  draft = j ? structuredClone(j) : newDraft(preset);

/* photos */
async function shrink(file){
  try{
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
    const cv = document.createElement("canvas"); cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(),"image/jpeg",.82));
  }catch{ return file; }
}
async function addPhotos(files, tag){
  if(!ASSETS){ toast("Photo uploads work on the published page."); return; }
  toast(`Uploading ${files.length} photo${files.length>1?"s":""}…`);

    try{ const b=await shrink(f); const r=await ASSETS.upload(b,{type:b.type||"image/jpeg"}); draft.photos.push({id:r.id, tag}); renderPhotos(); }

  }
  toast("Photos added — tap Save to keep them");
}

/* ---------- website form email import ---------- */
const LABELS = [
  [/^(full\s*name|your\s*name|name|customer\s*name|contact\s*name|client\s*name)$/i,"name"],
  [/^first(\s*name)?$/i,"first"], [/^last(\s*name)?$/i,"last"],
  [/^(e-?mail(\s*address)?|your\s*e-?mail)$/i,"email"],
  [/^(phone(\s*number)?|your\s*phone|tel(ephone)?|mobile|cell(\s*phone)?|best\s*(phone|number).*)$/i,"phone"],
  [/^((service|pickup|pick-up|job|street|property|your)?\s*address(\s*line\s*\d)?|street|location|city|state|zip(\s*code)?|postal\s*code)$/i,"addr"],
  [/^(message|comments?|details|description|project\s*details|your\s*message|notes?|what.*(remove|haul|need|pick).*|items?(\s*to\s*(be\s*)?removed?)?|tell\s*us.*|additional\s*(info|information|details).*|job\s*details)$/i,"msg"],
  [/^((preferred|pickup|service|requested|best)\s*)?(date|time|day)s?(\s*(preferred|requested))?$/i,"date"],
  [/^(how\s*did\s*you\s*(hear|find).*|referr(al|ed\s*by).*|source)$/i,"heard"]
];
const labelKey = l => { l=l.replace(/[*:\s]+$/,"").trim(); if(!l || l.length>45) return null; for(const [re,k] of LABELS) if(re.test(l)) return k; return null; };
const FOOTER = /^(sent\s+from|this\s+(e-?mail|message)\s+was|powered\s+by|--+$|©|unsubscribe|view\s+(this\s+)?entry|entry\s*(id|#))/i;
function parseFormEmail(text){
  const o={name:"",first:"",last:"",email:"",phone:"",addr:[],msg:[],date:"",heard:""};
  let cur=null;
  for(let line of (text||"").replace(/\r/g,"").split("\n")){
    line=line.replace(/^[>\s]+/,"").trim();
    if(!line) continue;
    if(FOOTER.test(line)) { cur=null; continue; }
    const m=line.match(/^([^:]{1,45}):\s*(.*)$/), mk=m&&labelKey(m[1]);
    if(mk){ cur=mk; if(m[2]) put(mk,m[2]); continue; }
    const k=labelKey(line); if(k){ cur=k; continue; }
    if(cur) put(cur,line);
  }
  function put(k,v){ if(k==="addr"||k==="msg") o[k].push(v); else if(!o[k]){ o[k]=v; cur=null; } }
  const full = text||"";
  if(!o.email){ const e=full.match(/[\w.+-]+@[\w-]+\.[\w.-]+/); if(e) o.email=e[0]; }
  if(!o.phone){ const p=full.match(/(\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}/); if(p) o.phone=p[0].trim(); }
  const name = o.name || [o.first,o.last].filter(Boolean).join(" ");
  return { name, email:o.email, phone:o.phone, address:o.addr.join(", "), message:o.msg.join("\n"), date:o.date, heard:o.heard };
}
const digits = s => (s||"").replace(/\D/g,"").slice(-10);
function applyImport(r, okMsg){
  const msgEl=$("#importmsg");
  if(!r || !(r.name||r.phone||r.email||r.message)){ if(msgEl) msgEl.textContent = SAMPLE?"Couldn't find the form fields — try “Read it with Claude”.":"Couldn't find the form fields — fill in by hand."; return; }
  const match = state.customers.find(c => (r.phone && digits(c.phone) && digits(c.phone)===digits(r.phone)) || (r.email && c.email && c.email.toLowerCase()===r.email.toLowerCase()));
  if(match){ $("#f-cust").value=match.id; }

let rcptCanvas=null;
const loadImg = src => new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
const loadScript = src => new Promise((res,rej)=>{ if([...document.scripts].some(s=>s.src===src)) return res(); const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
function receiptData(){
  const d=draft, s=state.settings, c=cust($("#f-cust")?.value) || cust(d.customerId);
  const price = Number(d.finalPrice) || d.quoteTotal || 0;
  let lines = quoteLines(d.quote).map(l=>({...l}));
  if(!lines.length) lines=[{label:"Junk removal & hauling", amount:price}];
  const diff = price - sum(lines,l=>l.amount);
  if(Math.abs(diff)>=0.5) lines.push({label: diff<0?"Discount":"Price adjustment", amount:diff});
  const tax = price*(Number(s.taxRate)||0)/100;
  const date = d.date || today();
  const kind = d.paid ? "Receipt" : "Invoice";
  const no = (d.paid?"R-":"INV-") + date.replace(/-/g,"").slice(2) + "-" + d.id.slice(-4).toUpperCase();
  const dn = (Number(d.disposal?.donated)||0) + (Number(d.disposal?.recycled)||0);
  return {d,s,c,price,lines,tax,total:price+tax,date,kind,no,diverted:dn>0&&dn<=100?dn:0};
}
function wrap(x, text, maxW){
  const words=String(text).split(/\s+/), out=[]; let line="";
  for(const w of words){ const t=line?line+" "+w:w; if(x.measureText(t).width>maxW && line){ out.push(line); line=w; } else line=t; }
  if(line) out.push(line); return out;
}
async function drawReceipt(){
  const r=receiptData(), {s,c}=r, W=1000, P=64, ACC="#C94A0B", INK="#1A1F1B", GREY="#6B736D", LINE="#DADDD6";
  const DISP='"Barlow Condensed","Arial Narrow",Arial,sans-serif', BODY='"Public Sans",Arial,sans-serif';
  try{ await Promise.all([document.fonts.load(`700 40px ${DISP}`),document.fonts.load(`400 20px ${BODY}`),document.fonts.load(`700 20px ${BODY}`)]); }catch{}
  const cv=document.createElement("canvas"); cv.width=W; cv.height=3000; const x=cv.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,W,3000); x.textBaseline="alphabetic";
  let y=P, left=P, logoH=0;
  if(s.logo){ try{ const img=await loadImg(blobUrl(s.logo)); const sc=Math.min(240/img.width, 170/img.height); logoH=img.height*sc; x.drawImage(img,P,y,img.width*sc,logoH); left=P+img.width*sc+28; }catch{} }
  x.fillStyle=INK; x.font=`700 38px ${DISP}`; x.fillText((s.businessName||"Junk Removal").toUpperCase(), left, y+36);
  x.fillStyle=GREY; x.font=`400 19px ${BODY}`;
  [s.phone, s.email, s.city].filter(Boolean).forEach((t,i)=>x.fillText(t,left,y+66+i*26));
  x.textAlign="right"; x.fillStyle=ACC; x.font=`700 52px ${DISP}`; x.fillText(r.kind.toUpperCase(), W-P, y+44);
  x.fillStyle=GREY; x.font=`400 19px ${BODY}`; x.fillText("No. "+r.no, W-P, y+76); x.fillText(fmtDate(r.date), W-P, y+102); x.textAlign="left";
  y += Math.max(150, logoH+28); x.fillStyle=LINE; x.fillRect(P,y,W-2*P,2); y+=44;
  const col2=W/2+20;
  x.fillStyle=GREY; x.font=`700 15px ${BODY}`; x.fillText("BILLED TO",P,y); x.fillText("JOB",col2,y);
  x.fillStyle=INK; x.font=`700 22px ${BODY}`; x.fillText(c?.name||"Customer",P,y+32);
  x.font=`400 19px ${BODY}`; x.fillStyle=INK;
  let ly=y+60; wrap(x, r.d.address||c?.address||"", W/2-P-40).forEach(t=>{x.fillText(t,P,ly); ly+=26;}); if(c?.phone){ x.fillText(c.phone,P,ly); ly+=26; }
  let ry=y+32; x.font=`400 19px ${BODY}`; wrap(x, r.d.title||"Junk removal", W-P-col2).slice(0,3).forEach(t=>{x.fillText(t,col2,ry); ry+=26;});
  x.fillStyle=GREY; x.fillText("Service date: "+fmtDate(r.date), col2, ry); ry+=26;
  y=Math.max(ly,ry)+30;
  x.fillStyle=INK; x.fillRect(P,y,W-2*P,2); y+=34;
  x.fillStyle=GREY; x.font=`700 15px ${BODY}`; x.fillText("DESCRIPTION",P,y); x.textAlign="right"; x.fillText("AMOUNT",W-P,y); x.textAlign="left"; y+=16;
  x.font=`400 20px ${BODY}`;
  for(const l of r.lines){
    const parts=wrap(x,l.label,W-2*P-180); y+=18;
    parts.forEach((t,i)=>{ x.fillStyle=INK; x.fillText(t,P,y+22+i*28); });
    x.textAlign="right"; x.fillText(money(l.amount),W-P,y+22); x.textAlign="left";
    y += 22 + (parts.length-1)*28 + 16; x.fillStyle=LINE; x.fillRect(P,y,W-2*P,1);
  }
  y+=40; const lx=W-P-340;
  const tot=(k,v,big)=>{ x.fillStyle=big?INK:GREY; x.font=big?`700 30px ${DISP}`:`400 20px ${BODY}`; x.fillText(k,lx,y); x.textAlign="right"; x.fillStyle=INK; x.font=big?`700 40px ${DISP}`:`600 20px ${BODY}`; x.fillText(v,W-P,y); x.textAlign="left"; y+=big?52:34; };
  if(r.tax){ tot("Subtotal",money(r.price)); tot(`Sales tax (${s.taxRate}%)`, "$"+r.tax.toFixed(2)); tot("TOTAL", "$"+r.total.toFixed(2), true); }
  else tot("TOTAL", money(r.total), true);
  y+=6;
  if(r.d.paid){ x.fillStyle="#2B7A4C"; x.font=`700 26px ${DISP}`; x.textAlign="right"; x.fillText(`PAID IN FULL · ${(r.d.payMethod||"Cash").toUpperCase()}`, W-P, y); x.textAlign="left"; }
  else { x.fillStyle=ACC; x.font=`700 26px ${DISP}`; x.textAlign="right"; x.fillText(`BALANCE DUE: ${r.tax?"$"+r.total.toFixed(2):money(r.total)}`, W-P, y); x.textAlign="left"; }
  y+=60;
  if(r.diverted){ x.fillStyle="#EAF3EE"; x.fillRect(P,y,W-2*P,58); x.fillStyle="#2B7A4C"; x.font=`600 19px ${BODY}`; x.fillText(`${Math.round(r.diverted)}% of your haul was donated or recycled instead of going to the landfill.`, P+20, y+36); y+=90; }
  x.fillStyle=LINE; x.fillRect(P,y,W-2*P,1); y+=40;
  x.fillStyle=INK; x.font=`600 20px ${BODY}`; wrap(x, s.receiptNote||"Thank you for your business!", W-2*P).forEach(t=>{x.fillText(t,P,y); y+=28;});
  if(s.reviewLink){ x.fillStyle=GREY; x.font=`400 18px ${BODY}`; x.fillText("Happy with the job? Leave us a review: "+s.reviewLink, P, y+4); y+=30; }
  y+=P-20;

}
function receiptText(){

    J("pj7","pc4","done","Basement debris","301 Pine Ct","Phone call",-40,"full",{paid:true,payMethod:"Cash",costs:{dump:120,fuel:20,labor:80}})
  ];
}

/* ---------- on-device storage ----------
   Stand-ins for the database, photo store and file saving, backed by IndexedDB on this device.
   They keep the same call shapes the rest of the app already uses. */
const LOCAL = (()=>{
  let dbp;
  const open = () => dbp || (dbp = new Promise((res,rej)=>{
    const r = indexedDB.open("hauldesk", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("docs"); r.result.createObjectStore("blobs"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = (store, mode, fn) => open().then(db => new Promise((res,rej)=>{
    const t = db.transaction(store, mode); fn(t.objectStore(store));
    t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error("aborted"));
  }));
  const all = store => open().then(db => new Promise((res,rej)=>{
    const out = {}; const c = db.transaction(store).objectStore(store).openCursor();
    c.onsuccess = () => { const cur = c.result; if(cur){ out[cur.key] = cur.value; cur.continue(); } else res(out); };
    c.onerror = () => rej(c.error);
  }));
  return { tx, all };
})();

const DOCS = {};          // "jobs/abc" -> body
const BLOB_URLS = {};     // asset id -> object URL
const blobUrl = id => BLOB_URLS[id] || "";
const listeners = [];     // {path, isDoc, fn}
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));

function colSnap(col){
  const pre = col + "/";
  const docs = Object.keys(DOCS).filter(k => k.startsWith(pre) && !k.slice(pre.length).includes("/")).sort()
    .map(k => { const id = k.slice(pre.length), body = DOCS[k]; return { id, exists:true, data:()=>clone(body) }; });
  return { docs, size:docs.length, empty:!docs.length, docChanges:()=>[], metadata:{fromCache:false, hasPendingWrites:false} };
}
function docSnap(path){
  const body = DOCS[path];
  return { id:path.split("/").pop(), exists: body!==undefined, data:()=>clone(body), metadata:{fromCache:false, hasPendingWrites:false} };
}
function notify(path){
  const col = path.slice(0, path.lastIndexOf("/"));
  for(const l of listeners){
    if(l.isDoc ? l.path===path : l.path===col) queueMicrotask(()=>l.fn(l.isDoc ? docSnap(l.path) : colSnap(l.path)));
  }
}
function docRef(path){
  return {
    id: path.split("/").pop(), path,
    async get(){ return docSnap(path); },
    async set(body){
      const w = $("#hd-welcome"); if(w){ w.hidden = true; w.style.display=""; }
      const b = clone(body);
      try{ await LOCAL.tx("docs","readwrite", s=>s.put(b, path)); }
      catch(e){ throw {code:"quota_exceeded", message:"This device is out of storage."}; }
      DOCS[path] = b; notify(path);
    },
    async update(body){ await this.set({...(DOCS[path]||{}), ...body}); },
    async delete(){ await LOCAL.tx("docs","readwrite", s=>s.delete(path)); delete DOCS[path]; notify(path); },
    onSnapshot(fn){ const l={path, isDoc:true, fn}; listeners.push(l); queueMicrotask(()=>fn(docSnap(path))); return ()=>{ const i=listeners.indexOf(l); if(i>=0) listeners.splice(i,1); }; }
  };
}
function colRef(col){
  return {
    path: col,
    doc: id => docRef(col + "/" + (id || uid())),
    async add(body){ const r = docRef(col + "/" + uid()); await r.set(body); return r; },
    async get(){ return colSnap(col); },
    onSnapshot(fn){ const l={path:col, isDoc:false, fn}; listeners.push(l); queueMicrotask(()=>fn(colSnap(col))); return ()=>{ const i=listeners.indexOf(l); if(i>=0) listeners.splice(i,1); }; }
  };
}
const LOCAL_DB = { doc: docRef, collection: colRef };

const hexId = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");
const LOCAL_ASSETS = {
  async upload(blob, opts={}){
    const type = opts.type || blob.type || "application/octet-stream";
    const b = blob.type === type ? blob : new Blob([blob], {type});
    const id = hexId();
    try{ await LOCAL.tx("blobs","readwrite", s=>s.put(b, id)); }
    catch(e){ throw {code:"quota_or_state", message:"This device is out of storage."}; }
    BLOB_URLS[id] = URL.createObjectURL(b);
    return { id, url: BLOB_URLS[id], sizeBytes: b.size, contentType: type };
  },
  async delete(id){
    await LOCAL.tx("blobs","readwrite", s=>s.delete(id));
    if(BLOB_URLS[id]){ URL.revokeObjectURL(BLOB_URLS[id]); delete BLOB_URLS[id]; }
    return { deleted:true };
  },
  async list(){ return { assets:[], usage:{} }; }
};

/* Saving a file: on phones, open the share sheet (Save to Files, Messages, email…); elsewhere, download it. */
async function saveFile(filename, data, type){
  const file = new File([data], filename, {type: type || data.type || "application/octet-stream"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }
    catch(e){ if(e && e.name==="AbortError") throw {code:"declined"}; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const LOCAL_DOWNLOADS = { save: ({filename, data}) => saveFile(filename, data) };

/* ---------- backup & restore ---------- */
const blobToDataURL = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
async function makeBackup(){
  try{
    toast("Preparing backup…");
    const blobs = await LOCAL.all("blobs"), out = {};
    for(const id in blobs) out[id] = await blobToDataURL(blobs[id]);
    const data = JSON.stringify({app:"haul-desk", v:1, saved:new Date().toISOString(), docs:DOCS, blobs:out});
    await saveFile(`haul-desk-backup-${today()}.json`, data, "application/json");
    toast("Backup ready — keep it somewhere safe (Files, iCloud, Google Drive)");
  }catch(e){ if(e?.code!=="declined") toast("Couldn't make the backup. Try again."); }
}
let pendingRestore = null;
function readRestore(file, boxSel="#hd-restore-box"){
  const r = new FileReader();
  r.onload = () => {
    const box = $(boxSel);
    try{
      const b = JSON.parse(r.result);
      if(!b || b.app!=="haul-desk" || !b.docs) throw 0;
      const keys = Object.keys(b.docs), n = p => keys.filter(k=>k.startsWith(p+"/")).length;
      pendingRestore = b;
      if(box) box.innerHTML = `<div class="banner" style="display:grid;gap:8px">Replace everything on this device with the backup from ${esc(b.saved?new Date(b.saved).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"an earlier date")}? It has ${n("jobs")} jobs, ${n("customers")} customers and ${n("ledger")} expense/income entries.<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-hd="cancelRestore">Cancel</button><button class="btn primary" data-hd="doRestore">Replace with backup</button></span></div>`;
    }catch(e){ pendingRestore = null; if(box) box.innerHTML = `<p class="sub" style="margin:0;color:var(--bad)">That file isn't a Haul Desk backup.</p>`; }
  };
  r.readAsText(file);
}
async function applyRestore(){
  const b = pendingRestore; pendingRestore = null; if(!b) return;
  toast("Restoring…");
  try{
    await LOCAL.tx("docs","readwrite", s=>{ s.clear(); for(const k in b.docs) s.put(b.docs[k], k); });
    const blobs = {};
    for(const id in (b.blobs||{})) blobs[id] = await (await fetch(b.blobs[id])).blob();
    await LOCAL.tx("blobs","readwrite", s=>{ s.clear(); for(const id in blobs) s.put(blobs[id], id); });
    location.reload();
  }catch(e){ toast("Couldn't restore that backup. This device may be out of storage."); }
}
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-hd]"); if(!el) return;
  const a = el.dataset.hd;
  if(a==="backup") makeBackup();
  else if(a==="cancelRestore"){ pendingRestore=null; ["#hd-restore-box","#hd-restore-box-welcome"].forEach(q=>{ const box=$(q); if(box) box.innerHTML=""; }); }
  else if(a==="doRestore") applyRestore();
});
document.addEventListener("change", e=>{
  if(e.target.id==="hd-restore"||e.target.id==="hd-restore-welcome"){ const f=e.target.files?.[0]; if(f) readRestore(f, e.target.id==="hd-restore-welcome"?"#hd-restore-box-welcome":"#hd-restore-box"); e.target.value=""; }
});

/* ---------- boot ---------- */
async function boot(){
  render();
  try{
    const [docs, blobs] = await Promise.all([LOCAL.all("docs"), LOCAL.all("blobs")]);
    Object.assign(DOCS, docs);
    for(const id in blobs) BLOB_URLS[id] = URL.createObjectURL(blobs[id]);
  }catch(e){
    toast("This browser can't save data. Open the app in Safari or Chrome, not a private window.");
    previewData(); state.loaded={jobs:true,customers:true,settings:true,ledger:true}; render(); return;
  }
  if(navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
  const welcome = $("#hd-welcome");
  if(welcome){ welcome.hidden = Object.keys(DOCS).length>0; if(!welcome.hidden) welcome.style.display="grid"; }
  DB = LOCAL_DB; ASSETS = LOCAL_ASSETS; DOWNLOADS = LOCAL_DOWNLOADS; SAMPLE = null; state.live = true;
  DB.collection("jobs").onSnapshot(s=>{ _dumpKey=null; state.jobs=s.docs.map(d=>({...d.data(), id:d.id})); state.loaded.jobs=true; render(); });
  DB.collection("customers").onSnapshot(s=>{ state.customers=s.docs.map(d=>({...d.data(), id:d.id})); state.loaded.customers=true; render(); });
  DB.collection("ledger").onSnapshot(s=>{ _dumpKey=null; state.ledger=s.docs.map(d=>({...d.data(), id:d.id})); state.loaded.ledger=true; render(); });
  DB.doc("settings/main").onSnapshot(s=>{ if(s.exists){ state.settings={...structuredClone(DEFAULT_SETTINGS), ...structuredClone(s.data())}; } state.loaded.settings=true; render(); });
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
}

boot();
</script>
